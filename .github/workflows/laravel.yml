name: Laravel

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
  - cron: "0 0 * * *"

jobs:
  laravel:

    runs-on: ubuntu-latest

    steps:
    - uses: shivammathur/setup-php@0b33ef444fd672ee683e20491b7798d937c69f8c
      with:
        php-version: '8.2'
    - uses: actions/checkout@v2
      with:
         ref: ${{ github.head_ref }}
    - name: Copy .env
      run: php -r "file_exists('.env') || copy('.env.example', '.env');"
    - name: Install Dependencies
      run: composer update -q --no-ansi --no-interaction --no-scripts --no-progress
    - name: Generate key
      run: php artisan key:generate
    - name: Boilerplate publish
      run: php artisan vendor:publish --tag=boilerplate-public --force
    - name: Directory Permissions
      run: chmod -R 777 storage bootstrap/cache
    - name: PHP CS Fixer
      run: vendor/bin/pint
    - uses: stefanzweifel/git-auto-commit-action@v4
      with:
          commit_message: Apply action changes
